name: Build Windows installer

# Push a tag like v0.1.0, or run this workflow manually and give it a tag name.
# The installer is published as a GitHub Release asset named Project-Oracle-Setup.exe, which is what the
# download page links to (releases/latest/download/Project-Oracle-Setup.exe).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update (for example v0.1.0)
        required: true
        default: v0.1.0

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install engine dependencies
        run: python -m pip install -e ".[dev]"

      - name: Engine tests
        run: python -m pytest -q

      - name: Download face landmarker model (build time only)
        run: python scripts/fetch_models.py

      - name: Freeze the engine with PyInstaller
        run: python scripts/build_backend.py

      - name: Smoke test the frozen engine
        shell: pwsh
        run: |
          $p = Start-Process -FilePath backend-dist/oracle-engine/oracle-engine.exe -ArgumentList '--port','0','--data-dir',"$env:RUNNER_TEMP/oracle-smoke" -RedirectStandardOutput smoke.txt -PassThru -WindowStyle Hidden
          $ready = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1
            if ((Test-Path smoke.txt) -and (Select-String -Path smoke.txt -Pattern 'ORACLE_READY' -Quiet)) { $ready = $true; break }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ready) { Write-Error 'Frozen engine did not report ORACLE_READY'; exit 1 }

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the installer
        working-directory: desktop
        run: |
          npm install
          npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash desktop/release/Project-Oracle-Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$h  Project-Oracle-Setup.exe" | Out-File -Encoding ascii desktop/release/Project-Oracle-Setup.exe.sha256

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Project ORACLE ${{ env.TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            desktop/release/Project-Oracle-Setup.exe
            desktop/release/Project-Oracle-Setup.exe.sha256
