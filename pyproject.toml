[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-oracle-engine"
version = "0.1.0"
description = "Local-first gaze, face, screen and decision engine for PROJECT ORACLE"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.4", "joblib>=1.3",
  "pydantic>=2.6", "fastapi>=0.110", "uvicorn>=0.29", "websockets>=12",
  "opencv-python>=4.9", "mediapipe>=0.10.14",
  "uiautomation>=2.0.18; sys_platform == 'win32'", "psutil>=5.9; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pyinstaller>=6.6"]

# Only the engine is a Python package; desktop/ (Electron) and scripts/ must not be auto-discovered.
[tool.setuptools.packages.find]
include = ["engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
